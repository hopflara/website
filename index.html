<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hi! i'm Lara!</title>

  <!-- Handwritten font for the title (CDN, no build step) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <!-- GSAP core + plugins (ScrollTrigger, Draggable) via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
</head>
<body>
  <main class="canvas">

    <!-- Hand-drawn arrows connecting each note to its picture (drawn by script.js) -->
    <svg class="connectors" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="5.5" refY="3"
                orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L7,3 L0,6 Z" fill="#d63384"></path>
        </marker>
      </defs>
    </svg>

    <!-- Center title -->
    <div class="title-block" style="left:40.3%; top:48.9%;">
      <h1 class="title">hi! i'm Lara!&#9825;</span><span class="stem"></span></span></h1>
      <p class="subtitle">welcome to my little corner of the internet :)</p>
    </div>

    <!-- ======================= PICTURES ======================= -->

    <!-- Photostrip: full viewport height, flush to the right edge -->
    <a class="item item--strip" id="i-photos" data-name="photos" href="photos.html" style="right:1%; top:2%;">
      <span class="float"><span class="scaler">
        <img src="images/photostrip.png" alt="film photostrip of Lara" />
      </span></span>
    </a>

    <!-- Phone -->
    <a class="item" id="i-phone" data-name="phone" href="social.html" style="left:4.4%; top:22.7%; width:9.5vw; --rot:-9deg;">
      <span class="float"><span class="scaler">
        <img src="images/phone.png" alt="phone" />
      </span></span>
    </a>

    <!-- Poem / open book -->
    <a class="item" id="i-poem" data-name="poem" href="poems.html" style="left:31.7%; top:9.6%; width:19vw; --rot:-2deg;">
      <span class="float"><span class="scaler">
        <img src="images/poem.png" alt="open book of poems" />
      </span></span>
    </a>

    <!-- Book stack -->
    <a class="item" id="i-books" data-name="books" href="books.html" style="left:55.1%; top:16.6%; width:16vw; --rot:3deg;">
      <span class="float"><span class="scaler">
        <img src="images/books.png" alt="stack of books" />
      </span></span>
    </a>

    <!-- Resume / blue folder -->
    <a class="item" id="i-resume" data-name="resume" href="resume.html" style="left:11.3%; top:60.6%; width:10vw; --rot:-4deg;">
      <span class="float"><span class="scaler">
        <img src="images/resume.png" alt="folder holding my resume" />
      </span></span>
    </a>

    <!-- Motivation buddy -->
    <a class="item" id="i-buddy" data-name="buddy" href="buddy.html" style="left:60.7%; top:39.7%; width:11vw; --rot:0deg;">
      <span class="float"><span class="scaler">
        <img src="images/buddy.png" alt="motivation buddy" />
      </span></span>
    </a>

    <!-- brainlist / butterfly checklist -->
    <a class="item" id="i-brainlist" data-name="brainlist" href="brainlist.html" style="left:29%; top:61.8%; width:13vw; --rot:2deg;">
      <span class="float"><span class="scaler">
        <img src="images/brainlist.png" alt="butterfly checklist" />
      </span></span>
    </a>

    <!-- evidio / flask -->
    <a class="item" id="i-evidio" data-name="evidio" href="evidio.html" style="left:49.3%; top:65.3%; width:8.5vw; --rot:-3deg;">
      <span class="float"><span class="scaler">
        <img src="images/evidio.png" alt="evidio flask" />
      </span></span>
    </a>

    <!-- ==================== NOTES (captions) ====================
         Each note points to a picture via data-for. Drag them freely
         in #edit mode; the arrows re-connect automatically. -->

    <div class="note" data-for="i-phone"     style="left:12.2%; top:10.4%;">my socials and my personal brand</div>
    <div class="note" data-for="i-poem"      style="left:18.6%; top:33.1%;">all my poems</div>
    <div class="note" data-for="i-books"     style="left:67.3%; top:4%;">things I read to become disgustingly educated</div>
    <div class="note" data-for="i-resume"    style="left:0.7%; top:83.2%;">my resume</div>
    <div class="note" data-for="i-buddy"     style="left:66.4%; top:65.4%;">my coded desktop motivation buddy</div>
    <div class="note" data-for="i-brainlist" style="left:28.8%; top:90%;">Brainlist, my ADHD calendar app</div>
    <div class="note" data-for="i-evidio"    style="left:62.4%; top:87.5%;">Evidio, my source-based short form platform</div>

  </main>

  <script src="script.js"></script>
</body>
</html>
