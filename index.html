<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hi! i'm Lara!</title>

  <!-- Handwritten font for the title (CDN, no build step) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <!-- GSAP core + plugins (ScrollTrigger, Draggable) via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
</head>
<body>
  <main class="canvas">

    <!-- Center title (middle of the page, items ringed around it) -->
    <div class="title-block" style="left:37%; top:48%;">
      <h1 class="title">hi! i'm Lara<span class="excl-heart"><span class="dot">&#9825;</span><span class="stem"></span></span></h1>
      <p class="subtitle">welcome to my little corner of the internet :)</p>
    </div>

    <!-- Photostrip: full viewport height, flush to the right edge -->
    <a class="item item--strip" href="photos.html" style="right:1%; top:2%;">
      <span class="float"><span class="scaler">
        <img src="images/photostrip.png" alt="film photostrip of Lara" />
        <span class="label">photos</span>
      </span></span>
    </a>

    <!-- Phone: top left -->
    <a class="item" href="social.html" style="left:6%; top:8%; width:9vw; --rot:-9deg;">
      <span class="float"><span class="scaler">
        <img src="images/phone.png" alt="phone" />
        <span class="label">my socials (not an influencer, yet)</span>
      </span></span>
    </a>

    <!-- Poem / open book: top center -->
    <a class="item" href="poems.html" style="left:27%; top:7%; width:16vw; --rot:-2deg;">
      <span class="float"><span class="scaler">
        <img src="images/poem.png" alt="open book of poems" />
        <span class="label">all my poems</span>
      </span></span>
    </a>

    <!-- Book stack: top right (kept clear of the photostrip lane) -->
    <a class="item" href="books.html" style="left:50%; top:10%; width:14vw; --rot:3deg;">
      <span class="float"><span class="scaler">
        <img src="images/books.png" alt="stack of books" />
        <span class="label">the books i loved</span>
      </span></span>
    </a>

    <!-- Resume / blue folder: left middle -->
    <a class="item" href="resume.html" style="left:4%; top:40%; width:10vw; --rot:-4deg;">
      <span class="float"><span class="scaler">
        <img src="images/resume.png" alt="folder holding my resume" />
        <span class="label">my resume</span>
      </span></span>
    </a>

    <!-- Motivation buddy: right middle (kept clear of the photostrip lane) -->
    <a class="item" href="buddy.html" style="left:65%; top:40%; width:11vw; --rot:0deg;">
      <span class="float"><span class="scaler">
        <img src="images/buddy.png" alt="motivation buddy" />
        <span class="label">a motivation buddy i made</span>
      </span></span>
    </a>

    <!-- brainlist / butterfly checklist: bottom left -->
    <a class="item" href="brainlist.html" style="left:38%; top:66%; width:13vw; --rot:2deg;">
      <span class="float"><span class="scaler">
        <img src="images/brainlist.png" alt="butterfly checklist" />
        <span class="label">my ADHD calendar app</span>
      </span></span>
    </a>

    <!-- evidio / flask: bottom center -->
    <a class="item" href="evidio.html" style="left:57%; top:70%; width:7vw; --rot:-3deg;">
      <span class="float"><span class="scaler">
        <img src="images/evidio.png" alt="evidio flask" />
        <span class="label">evidio &mdash; my source-based social platform</span>
      </span></span>
    </a>

  </main>

  <script src="script.js"></script>
</body>
</html>
